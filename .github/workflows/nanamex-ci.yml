name: nanamex CI

# Scoped to the Clin (Nanamex) venture only (projects/nanamex/), per the monorepo-of-
# ventures structure (see repo root README.md). Runs lint, typecheck, test, and a
# production build on every PR that touches this project; fails the PR if any step fails.
# Per engineering/implementation-plan.md E0-01 and AGENTS.md Implementation Rules.

on:
  pull_request:
    paths:
      - "projects/nanamex/**"
      - ".github/workflows/nanamex-ci.yml"
  push:
    branches:
      - main
    paths:
      - "projects/nanamex/**"
      - ".github/workflows/nanamex-ci.yml"

defaults:
  run:
    working-directory: projects/nanamex

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/nanamex/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Secret-scan (no server-only key exposed client-side)
        run: npm run check:secrets

  migrations:
    name: Migrations apply cleanly to a fresh Supabase instance
    runs-on: ubuntu-latest
    # Per engineering/implementation-plan.md E0-02: proves db/migrations applies cleanly
    # via the Supabase CLI in CI. Runs against a fresh, ephemeral local Supabase stack
    # (Docker, torn down with the runner) rather than a hosted project — no hosted
    # dev/preview/prod secrets are needed in CI, and this doubles as a genuine "clean
    # instance" test on every PR. db/migrations is the canonical migrations directory
    # (symlinked from supabase/migrations, which the Supabase CLI requires by convention).
    # See agent/DECISIONS.md for why preview/prod aren't hosted yet (billing decision).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.75.0"

      - name: Start local Supabase stack and apply migrations
        run: |
          supabase start -x realtime,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,studio
          supabase db reset --local

      - name: Verify zonas seed populated (row count > 0)
        # Per engineering/implementation-plan.md E0-03's own stated Validation criterion:
        # "a query confirms seed row count > 0" -- must be an automated, repo-enforced
        # check, not just a manually-run one, so a future regression (e.g. a broken
        # ON CONFLICT target, a renamed seed file breaking the sql_paths glob, or an
        # accidentally-disabled [db.seed]) fails the build instead of silently shipping
        # zero seeded zonas. `supabase db reset` above only fails on a SQL error, which
        # none of those regressions would necessarily produce.
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)
          count=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 55322 -U postgres -d postgres -tAc "select count(*) from public.zonas;")
          echo "zonas row count: ${count}"
          if [ -z "${count}" ] || [ "${count}" -le 0 ]; then
            echo "::error::zonas seed produced 0 rows -- check db/seed.sql, its ON CONFLICT target, and [db.seed] in supabase/config.toml"
            exit 1
          fi

      - name: Verify necesidad draft RPC authorization and atomic child replacement
        run: npm run test:db
