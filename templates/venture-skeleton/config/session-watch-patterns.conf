# provider|extended regular expression
#
# Non-secret patterns used by scripts/watch-session-limit.sh. Each line applies to the
# named CLI (`claude`, `opencode`, or `codex`) or `all`. Keep patterns conservative: this
# watcher reports a *likely* limit only and never changes a worker session or its files.

all|(usage|rate)[[:space:]-]*limit
all|quota[[:space:]].*(reached|exhausted)
all|(limit|quota).*(reached|exhausted)
all|try again[[:space:]].*(later|after)
all|resets?[[:space:]]+(at|in)
