# provider|extended regular expression
#
# Advisory terminal-output patterns for permission requests. Claude Code uses its native
# Notification hook for exact `permission_prompt` events, so it is intentionally omitted
# here to avoid duplicate Telegram messages. OpenCode and Codex are watched when their
# interactive terminal output exposes an approval request.

opencode|(permission|approval)[[:space:]].*(required|needed|requested)
opencode|(allow|approve|reject).*(command|tool|permission)
codex|(permission|approval)[[:space:]].*(required|needed|requested)
codex|(allow|approve|deny).*(command|tool|permission)
