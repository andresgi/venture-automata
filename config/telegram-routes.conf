# Maps a Telegram message tag to the venture repo its idea should be filed against.
#
# Used by scripts/telegram-idea-router.sh. One route per line:
#   tag=owner/repo
#
# Send a message to the bot as:
#   #tag the idea text goes here
#
# The router strips the leading #tag and files the rest as a GitHub issue labeled "idea"
# in the mapped repo. Unknown tags get a reply telling you so, instead of being silently
# dropped or misfiled.
#
# Example:
# invoice-pilot=andresgi/invoice-pilot
# nanamex=andresgi/nanamex
the-split-game=andresgi/the-split-game
